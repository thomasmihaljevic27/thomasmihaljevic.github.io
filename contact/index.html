    <style>
        :root {
            --bg-color: #0b0c10;
            --surface-color: #1f2833;
            --text-primary: #ffffff;
            --text-secondary: #c5c6c7;
            --border-color: #333;
            --accent-green: #45a247;
            --accent-blue: #283c86;
            --main-gradient: linear-gradient(90deg, #45a247 0%, #283c86 50%, #f15f2a 100%);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 0 24px;
            width: 100%;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px 0;
            margin-bottom: 40px;
        }

        .logo-link {
            text-decoration: none;
            color: inherit;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: -0.02em;
            transition: opacity 0.2s;
        }
        .logo-link:hover { opacity: 0.8; }

        .logo-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--main-gradient); }

        nav a {
            color: var(--text-secondary);
            text-decoration: none;
            margin-left: 24px;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s;
        }
        nav a:hover, nav a.active { color: #fff; }

        /* Form Styling */
        .contact-content {
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
        }

        h1 { font-size: 2.5rem; margin-bottom: 30px; font-weight: 800; }

        .form-group { margin-bottom: 24px; }

        label {
            display: block;
            margin-bottom: 8px;
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-green);
        }

        textarea { height: 200px; resize: vertical; }

        .submit-btn {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            width: 100%;
            margin-top: 10px;
        }

        .submit-btn:hover { opacity: 0.9; }

        /* Footer */
        <footer>
    <span style="display: flex; align-items: center; gap: 8px;">
        Thunder Bay, ON 
        <img src="https://flagcdn.com/ca.svg" alt="Canada Flag" style="height: 14px;">
    </span>

    <span class="footer-social">
        <a href="https://linkedin.com/in/YOUR_HANDLE" target="_blank" class="footer-social-link">

</head>
<body>

    <div class="container">
        <header>
            <a href="/" class="logo-link">
                <div class="logo-dot"></div>
                THOMAS MIHALJEVIC
            </a>
            <nav>
                <a href="/#work">Work</a>
                <a href="/#manifesto">About</a>
                <a href="/contact/" class="active">Contact</a>
            </nav>
        </header>

        <div class="contact-content">
            <h1>Contact</h1>

            <form action="https://formspree.io/f/mojnnqry" method="POST">
                
                <div class="form-group">
                    <label>Your Email</label>
                    <input type="email" name="_replyto" required placeholder="name@example.com">
                </div>

                <div class="form-group">
                    <label>Subject</label>
                    <input type="text" name="subject" required placeholder="Regarding...">
                </div>

                <div class="form-group">
                    <label>Body</label>
                    <textarea name="message" required placeholder="Type your message here..."></textarea>
                </div>

                <button type="submit" class="submit-btn">Send</button>
            </form>
        </div>

        <footer>
            <span style="display: flex; align-items: center; gap: 8px;">
                Thunder Bay, ON 
                <img src="https://flagcdn.com/ca.svg" alt="Canada Flag" style="height: 14px;">
            </span>
            <span id="last-updated"></span>
        </footer>
    </div>

    <script>
        const date = new Date(document.lastModified);
        const options = { year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('last-updated').textContent = "Last updated: " + date.toLocaleDateString('en-CA', options);
    </script>
