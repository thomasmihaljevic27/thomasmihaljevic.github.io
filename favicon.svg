<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Thomas Mihaljevic">
  <!-- Solid tile in the site's pine accent. A filled tile holds up against
       both light and dark browser chrome. -->
  <rect width="64" height="64" fill="#2F5D43"/>

  <!-- Lowercase serif "tm" drawn as rectangles rather than live text, so it
       renders identically everywhere instead of depending on an installed
       font. Proportions are tuned for legibility at 16px: stems 6 units
       wide, counters 6 units, and 4 units of space between the t and the m
       so the letters do not merge in a browser tab. -->
  <g fill="#FAF8F3">
    <rect x="4.5" y="26" width="15" height="5"/>  <!-- t crossbar -->
    <rect x="7.5" y="16" width="6" height="32"/>  <!-- t stem -->
    <rect x="13.5" y="44" width="8" height="4"/>  <!-- t tail -->
    <rect x="27.5" y="26" width="30" height="5.5"/>  <!-- m shoulder -->
    <rect x="27.5" y="26" width="6" height="22"/>  <!-- m stem 1 -->
    <rect x="39.5" y="26" width="6" height="22"/>  <!-- m stem 2 -->
    <rect x="51.5" y="26" width="6" height="22"/>  <!-- m stem 3 -->
    <rect x="25.5" y="44" width="10" height="4"/>  <!-- m foot 1 -->
    <rect x="37.5" y="44" width="10" height="4"/>  <!-- m foot 2 -->
    <rect x="49.5" y="44" width="10" height="4"/>  <!-- m foot 3 -->
  </g>
</svg>
